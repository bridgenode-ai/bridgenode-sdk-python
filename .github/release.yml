# Auto-generated release notes (GitHub): categorize PRs by labels.
# C5 (fix.md): Breaking/Features/Fixes/Other → structured release notes.
changelog:
  exclude:
    labels:
      - ignore-for-release
      - dependencies
  categories:
    - title: "💥 Breaking Changes"
      labels:
        - breaking
    - title: "🚀 Features"
      labels:
        - enhancement
        - feature
    - title: "🐛 Bug Fixes"
      labels:
        - bug
        - fix
    - title: "📦 Dependencies"
      labels:
        - dependencies
    - title: "🛠 Other Changes"
      labels:
        - "*"
