name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -e .[dev]
      - name: Audit dependencies (pip-audit, §8.4)
        run: pip install pip-audit && pip-audit
      - name: Run tests
        run: pytest tests/ -q
