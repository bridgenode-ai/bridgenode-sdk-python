version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # solana 0.40.x removed solana.rpc.api — x402 imports it (broken combo).
      # Intentional exception (2026-08-31); PR #3 closed. See server.md.
      - dependency-name: "solana"
